# Nacos 共享配置（dataId: common-shared.yaml, group: DEFAULT_GROUP）
# 使用方式：Nacos 控制台「配置管理」新建，粘贴本文件内容
security:
  jwt:
    secret: aidaima-dev-jwt-secret-please-override-0123456789
    expiration-seconds: 3600
  internal:
    token: aidaima-internal-token-please-override
  # ===== 网关 CORS 白名单（仅网关消费；逗号分隔）=====
  cors:
    # 开发默认仅允许本地前端；生产环境必须在 Nacos 覆盖为真实域名，localhost/127.0.0.1 会被启动守卫拒绝
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  qr:
    # 扫码场景有效期（秒）
    ttl-seconds: 120
  # ===== 网关限流阈值（IP 令牌桶）=====
  ratelimit:
    sms-code:
      replenish-rate: 1
      burst-capacity: 3
    qr-create:
      replenish-rate: 1
      burst-capacity: 3
    qr-poll:
      replenish-rate: 10
      burst-capacity: 20

# ===== 短信验证码 =====
sms:
  # 短信通道实现：console=控制台降级；接第三方时新增 SmsSender 实现
  provider: console
  # 万能测试码，仅 provider=console 生效；生产置空
  master-code: "123456"
  code-length: 6
  code-ttl-seconds: 300
  send-cooldown-seconds: 60
  daily-limit: 10
  max-verify-failures: 5
spring:
  ai:
    model:
      # 关闭 OpenAI 嵌入模型自动配置（嵌入改用本地 ONNX 模型，零新增密钥）
      embedding: none
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  # ===== Kafka =====
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 2000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
      missing-topics-fatal: false
logging:
  level:
    com.common: info

# ===== AI 医院助手（V1.0）=====
ai:
  prompt:
    chat: |
      你是医院场景的 AI 助手，为患者提供友好、简洁的交流服务；不提供诊断与用药建议。
    triage: |
      你是医院 AI 导诊助手。根据患者描述的症状，结合【科室列表】给出就诊科室建议。
      硬性要求：
      1. 严禁输出任何确诊结论、处方或用药建议；
      2. 仅可依据工具返回的真实科室/号源数据作答，禁止编造科室与号源；
      3. 导诊给出建议后，主动询问患者是否需要协助查询该科室的可预约号源。
    rag: |
      你是医院知识库问答助手。仅依据【知识库片段】回答院内规则、门诊时间、医保政策、科室介绍、就诊流程问题；
      片段不足以回答时如实说明"知识库未收录该内容"，禁止编造。
  disclaimer: "> AI内容仅供参考，不能替代执业医师诊断，请前往线下医院就诊。"
  safety:
    keywords: "给我开药,开点药,开处方,确诊,诊断为,吃什么药,用药建议,开什么药"
    blocked-message: "该问题涉及诊疗建议，我仅能提供导诊参考，不能提供诊断或用药建议，请以执业医师面诊为准。"
    emergency-keywords: "胸痛,呼吸困难,喘不上气,意识不清,昏迷,抽搐,偏瘫,口齿不清,大出血,咯血,呕血,剧烈头痛,农药中毒,服毒,自杀,割腕,车祸,高处坠落"
    emergency-message: "【紧急提示】您描述的情况可能属于急症，请立即拨打 120 或尽快前往最近医院急诊科就诊，不要等待线上回复。"
  rag:
    chunk-size: 800
    similarity-threshold: 0.5
    top-k: 4
    max-references: 3
    vector-path: "data/vector"
    embedding-model-path: ""
  ratelimit:
    replenish-rate: 10
    burst-capacity: 20

# ===== 可观测性 =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
