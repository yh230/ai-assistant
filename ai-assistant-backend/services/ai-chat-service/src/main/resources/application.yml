server:
  port: 9204

spring:
  application:
    name: ai-chat-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  config:
    import:
      - optional:nacos:common-shared.yaml?group=DEFAULT_GROUP
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
  datasource:
    url: jdbc:mysql://localhost:3306/chat_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
  ai:
    openai:
      enabled: false

# 本地降级开关：AI 调用失败时是否使用内置回复引擎
ai:
  local-fallback: true
  assistant:
    default-model: openai
    models:
      openai:
        type: openai
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat
        enabled: true
        temperature: 0.8

# 天气服务配置（高德开放平台）
weather:
  amap-key: ${AMAP_KEY:}
  geocoding-url: https://restapi.amap.com/v3/geocode/geo
  weather-url: https://restapi.amap.com/v3/weather/weatherInfo

security:
  jwt:
    secret: ${JWT_SECRET:aidaima-dev-jwt-secret-please-override-0123456789}
    expiration-seconds: 3600
  internal:
    token: ${INTERNAL_TOKEN:aidaima-internal-token-please-override}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.aiassistant: info
    org.springframework.ai: info
    com.common: info
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
