server:
  port: 9204

spring:
  application:
    name: ai-chat-service
  config:
    import:
      - classpath:application-common.yml
      - optional:nacos:common-shared.yaml?group=DEFAULT_GROUP
  kafka:
    listener:
      missing-topics-fatal: false
  datasource:
    url: jdbc:mysql://localhost:3306/chat_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  elasticsearch:
    uris: ${ES_URI:http://localhost:9200}
  ai:
    openai:
      enabled: false

# AI 业务配置
ai:
  rag:
    # 向量存储实现：simple（本地文件）| elasticsearch（BM25+kNN 混合检索）
    store: ${AI_RAG_STORE:simple}
    # 嵌入维度（必须与 ES 索引 dense_vector dims 一致）
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:384}
    # 切片重叠比例（0~0.5）
    chunk-overlap: ${AI_RAG_CHUNK_OVERLAP:0.15}
    elasticsearch:
      index-name: ${AI_RAG_ES_INDEX:ai_knowledge_chunk_v1}
      analyzer: ${AI_RAG_ES_ANALYZER:cjk_ngram}
  assistant:
    default-model: openai
    models:
      openai:
        type: openai
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat
        enabled: true
        temperature: 0.8

# 天气服务配置（高德开放平台）
weather:
  amap-key: ${AMAP_KEY:}
  geocoding-url: https://restapi.amap.com/v3/geocode/geo
  weather-url: https://restapi.amap.com/v3/weather/weatherInfo

logging:
  level:
    com.aiassistant: info
    org.springframework.ai: info
