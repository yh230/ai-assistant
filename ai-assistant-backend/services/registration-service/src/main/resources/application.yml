server:
  port: 9203

spring:
  application:
    name: registration-service
  config:
    import:
      - classpath:application-common.yml
      - optional:nacos:common-shared.yaml?group=DEFAULT_GROUP
  datasource:
    url: jdbc:mysql://localhost:3306/registration_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.registration: info
