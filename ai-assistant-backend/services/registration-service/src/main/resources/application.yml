server:
  port: 9203

spring:
  application:
    name: registration-service
  datasource:
    url: jdbc:mysql://localhost:3306/registration_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

security:
  internal:
    token: ${INTERNAL_TOKEN:aidaima-internal-token-please-override}

logging:
  level:
    com.registration: info
    com.common: info
