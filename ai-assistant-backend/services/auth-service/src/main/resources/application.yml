server:
  port: 9200

spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  config:
    import:
      - optional:nacos:common-shared.yaml?group=DEFAULT_GROUP
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 2000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

security:
  jwt:
    secret: ${JWT_SECRET:aidaima-dev-jwt-secret-please-override-0123456789}
    expiration-seconds: 3600
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  internal:
    token: ${INTERNAL_TOKEN:aidaima-internal-token-please-override}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    window-minutes: ${LOGIN_WINDOW_MINUTES:15}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  qr:
    # 扫码场景有效期（秒）
    ttl-seconds: 120

# 短信验证码（本地无 Nacos 也可启动的默认占位）
sms:
  provider: ${SMS_PROVIDER:console}
  master-code: ${SMS_MASTER_CODE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.auth: info
    com.common: info
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
