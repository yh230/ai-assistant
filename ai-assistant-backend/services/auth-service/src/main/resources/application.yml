server:
  port: 9200

spring:
  application:
    name: auth-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  config:
    import:
      - optional:nacos:common-shared.yaml?group=DEFAULT_GROUP
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

security:
  jwt:
    secret: ${JWT_SECRET:aidaima-dev-jwt-secret-please-override-0123456789}
    expiration-seconds: 3600
  internal:
    token: ${INTERNAL_TOKEN:aidaima-internal-token-please-override}

logging:
  level:
    com.auth: info
    com.common: info
