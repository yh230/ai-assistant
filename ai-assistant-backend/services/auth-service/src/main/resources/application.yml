server:
  port: 9200

spring:
  application:
    name: auth-service
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

security:
  jwt:
    secret: ${JWT_SECRET:aidaima-dev-jwt-secret-please-override-0123456789}
    expiration-seconds: 3600
  internal:
    token: ${INTERNAL_TOKEN:aidaima-internal-token-please-override}

logging:
  level:
    com.auth: info
    com.common: info
