server:
  port: 8088

spring:
  # 本机密钥放 application-local.yml（已 gitignore，不入库）；克隆项目后可用环境变量替代
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://localhost:3306/ai_assistant?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # Redis：JWT 撤销机制（登出黑名单/踢下线）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      # password: ${REDIS_PASSWORD:}（如需 Redis 密码，配置环境变量 REDIS_PASSWORD）
  # 关闭 Spring AI 自带的 OpenAI 自动配置：
  # 模型统一由 ai.assistant.models 手动构建（ChatModelRegistry），避免空 Key 冲突，且支持多模型
  ai:
    openai:
      enabled: false

# 本地降级开关：AI 调用失败时是否使用内置回复引擎
ai:
  local-fallback: true
  assistant:
    # 默认模型（前端未指定时使用）。
    # 注意：角色不再出现在配置文件中 —— 角色完全由数据库驱动，
    # 可在「角色管理」页面自由增删改查，首次启动由内置默认角色播种。
    default-model: openai

    # ==================== 模型定义（对接大模型，运行时按 modelId 切换） ====================
    # type 支持：openai（含所有兼容 OpenAI 协议的服务）、dashscope、ollama（待实现）
    # 启用更多模型：复制一份把 enabled 改为 true 并填入对应 apiKey 即可
    models:
      openai:
        type: openai
        base-url: https://api.deepseek.com
        # API Key：默认空（空值时降级本地回复引擎）；在 application-local.yml 或环境变量 DEEPSEEK_API_KEY 中配置
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat
        enabled: true
        temperature: 0.8
      # 示例：通义千问（DashScope 兼容模式，复用 openai 类型）
      # qwen:
      #   type: openai
      #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      #   api-key: ${DASHSCOPE_API_KEY:}
      #   model: qwen-plus
      #   enabled: false
      #   temperature: 0.7
      # 示例：Ollama 本地模型（需自行实现 ChatModelRegistry 中的 OLLAMA 分支）
      # ollama:
      #   type: ollama
      #   base-url: http://localhost:11434
      #   model: qwen2.5
      #   enabled: false

# 天气服务配置（高德开放平台，Open-Meteo 已被网络出口拦截弃用）
# 变更点：amap-key 需填入高德「Web服务」类型 Key（lbs.amap.com 控制台创建应用获取），
# 在 application-local.yml 或环境变量 AMAP_KEY 中配置
weather:
  amap-key: ${AMAP_KEY:}
  geocoding-url: https://restapi.amap.com/v3/geocode/geo
  weather-url: https://restapi.amap.com/v3/weather/weatherInfo

security:
  jwt:
    # JWT 签名密钥（HS256，长度须 >= 32 字节），生产环境请用环境变量覆盖
    secret: ${JWT_SECRET:aidaima-dev-jwt-secret-please-override-0123456789}
    # 令牌有效期（秒），与原 Sa-Token timeout 一致
    expiration-seconds: 3600

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/*.xml

logging:
  level:
    com.aiassistant: info
    org.springframework.ai: info
