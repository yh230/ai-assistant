name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-assistant-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: ai-assistant-backend/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend workspaces (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build both frontends
        run: npm run build

  data-platform:
    name: Data Platform (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-assistant-data-platform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-assistant-data-platform/pyproject.toml

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit

  tests:
    name: Black-box test suites (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-assistant-tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r ai-assistant-tests/requirements.txt

      - name: API helper unit tests
        working-directory: ai-assistant-tests/api
        run: python -m pytest helpers/tests -q

      - name: Collect API tests
        working-directory: ai-assistant-tests/api
        run: python -m pytest --collect-only -q

      - name: Collect UI tests
        working-directory: ai-assistant-tests/ui
        run: python -m pytest --collect-only -q
