name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issue，并确认日志中不包含真实密钥、令牌或患者隐私数据。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？影响哪个端（患者端 / 员工端 / 网关 / 服务）？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 ...
        2. 访问 ...
        3. 点击 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请粘贴关键日志（保留 traceId），不要粘贴密钥、完整令牌或患者隐私。
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: 例如 v1.0.0 或 commit hash
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: 例如 Windows 11 / JDK 17 / MySQL 8 / Redis 7 / Nacos 3.x / Kafka 3.x / ES 8.x
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue
          required: true
        - label: 我已移除密钥、令牌与患者隐私数据
          required: true
